openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: news
    description: Korean-language news
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /news/korean:
    get:
      operationId: getKoreanNews
      tags: [news]
      summary: Get recent Korean-language technology headlines
      responses:
        "200":
          description: Recent Korean news headlines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KoreanNewsResponse"
        "502":
          description: News provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KoreanNewsStory:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
      required:
        - id
        - title
        - source
        - publishedAt
        - url
    KoreanNewsResponse:
      type: object
      properties:
        stories:
          type: array
          items:
            $ref: "#/components/schemas/KoreanNewsStory"
      required:
        - stories
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

